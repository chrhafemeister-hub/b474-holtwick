<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Gehweg B 474 Holtwick</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{--bg:#f3f4f2;--panel:#fff;--fg:#1d2321;--muted:#5d6763;--line:#d4d9d5;--accent:#1b5a96;--sign:#f2c400;--crit:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--panel:#1c2120;--fg:#e6e9e7;--muted:#9aa49f;--line:#2f3634;--accent:#7fb1e3;--crit:#f08a80;color-scheme:dark}}
.tor{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;box-sizing:border-box}
.karte{background:var(--panel);border:1px solid var(--line);padding:28px 24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.schild{align-self:flex-start;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;background:var(--sign);color:#111;border:3px solid #111;border-radius:8px;padding:0 10px;line-height:1.3}
.karte h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:32px;line-height:1;margin:0}
.karte p{margin:0;color:var(--muted);font-size:15px}
.karte label{font-size:14px;font-weight:600}
.karte input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.karte input:focus{outline:2px solid var(--accent);outline-offset:1px}
.karte button{font:inherit;font-size:16px;font-weight:600;border:0;background:var(--accent);color:var(--panel);padding:11px;border-radius:4px;cursor:pointer}
.karte button:disabled{opacity:.6;cursor:wait}
.fehler{color:var(--crit);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<div class="tor" id="tor">
  <form class="karte" id="form" autocomplete="off">
    <span class="schild">B 474</span>
    <h1>Gehweg Ortsdurchfahrt Holtwick</h1>
    <p>Informationen für die Anlieger der Legdener Straße. Bitte geben Sie das Passwort ein, das Sie erhalten haben.</p>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" required autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="fehler" id="fehler" role="alert"></div>
    <button type="submit" id="los">Öffnen</button>
  </form>
</div>
<div id="app"></div>
<script src="pdf.min.js"></script>
<script>
(function(){
  const SALT = Uint8Array.from(atob("yu4Wb7l1xirIxrCDze3ShA=="), c => c.charCodeAt(0));
  const ITER = 310000;
  let KEY = null;
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  async function ableiten(pw){
    const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:SALT, iterations:ITER, hash:"SHA-256"}, basis, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }
  async function entschluesseln(buf){
    const b = new Uint8Array(buf);
    return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, KEY, b.slice(12)));
  }
  window.ladeEnc = async f => {
    const r = await fetch(f + ".enc");
    if (!r.ok) throw new Error("Datei fehlt");
    return entschluesseln(await r.arrayBuffer());
  };
  async function starten(){
    const r = await fetch("site.enc");
    const p = JSON.parse(new TextDecoder().decode(await entschluesseln(await r.arrayBuffer())));
    const st = document.createElement("style"); st.textContent = p.css; document.head.appendChild(st);
    document.getElementById("tor").remove();
    document.getElementById("app").innerHTML = p.html;
    const sc = document.createElement("script"); sc.textContent = p.js; document.body.appendChild(sc);
  }
  async function gespeichert(){
    try {
      const roh = sessionStorage.getItem("b474k"); if (!roh) return false;
      KEY = await crypto.subtle.importKey("raw", Uint8Array.from(atob(roh), c => c.charCodeAt(0)), "AES-GCM", true, ["decrypt"]);
      await starten(); return true;
    } catch (e) { try { sessionStorage.removeItem("b474k"); } catch (x) {} KEY = null; return false; }
  }
  const form = document.getElementById("form"), fehler = document.getElementById("fehler"), los = document.getElementById("los");
  form.addEventListener("submit", async e => {
    e.preventDefault(); fehler.textContent = ""; los.disabled = true; los.textContent = "Wird geöffnet …";
    try {
      KEY = await ableiten(document.getElementById("pw").value.trim());
      await starten();
      try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", KEY)); sessionStorage.setItem("b474k", btoa(String.fromCharCode(...raw))); } catch (x) {}
    } catch (err) {
      KEY = null; fehler.textContent = "Das Passwort stimmt nicht. Bitte prüfen Sie Groß- und Kleinschreibung.";
      los.disabled = false; los.textContent = "Öffnen";
    }
  });
  if (!window.crypto || !crypto.subtle) { fehler.textContent = "Dieser Browser kann die Seite nicht öffnen. Bitte einen aktuellen Browser verwenden."; los.disabled = true; }
  else gespeichert();
})();
</script>
</body>
</html>
